mapping:
  - target: MainMemory
    type: temporal
    permutation: IJCOHW

  - target: GlobalBuffer
    type: dataspace
    bypass: [Outputs]
    keep:   [Inputs, Weights, Bias]

  - target: GlobalBuffer
    type: temporal
    permutation: JOC

  - target: PE
    type: spatial
    factors: O=16 J=8
    permutation: OJ

  - target: RegisterFile
    type: temporal
    factors: H=3 W=3 C=1
    permutation: HWC