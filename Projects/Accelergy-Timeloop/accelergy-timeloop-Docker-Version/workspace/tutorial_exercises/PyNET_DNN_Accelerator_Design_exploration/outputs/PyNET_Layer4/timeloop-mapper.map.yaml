mapping:
  - target: RegisterFile
    type: datatype
    keep:
      - Weights
      - Inputs
      - Bias
      - Outputs
    bypass:
      []
  - target: inter_PE_spatial
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Bias
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Weights
      - Inputs
      - Bias
    bypass:
      - Outputs
  - target: MainMemory
    type: datatype
    keep:
      - Weights
      - Inputs
      - Bias
      - Outputs
    bypass:
      []
  - target: RegisterFile
    type: temporal
    factors: C1 O4 I1 J2 H3 W3
    permutation: OJHWCI
