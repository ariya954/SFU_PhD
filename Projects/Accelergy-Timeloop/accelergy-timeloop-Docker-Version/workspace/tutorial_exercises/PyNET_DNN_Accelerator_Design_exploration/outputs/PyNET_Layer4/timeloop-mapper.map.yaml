    type: spatial
    factors: C1 O16 I2 J8 H1 W1
    permutation: OJICHW
    split: 1
  - target: inter_PE_spatial
    type: temporal
    factors: C1 O1 I1 J1 H1 W1
    permutation: COIJHW
  - target: GlobalBuffer
    type: temporal
    factors: C128 O1 I8 J1 H1 W1
    permutation: CIOJHW
  - target: MainMemory
    type: temporal
    factors: C1 O4 I64 J64 H1 W1
    permutation: IJOCHW