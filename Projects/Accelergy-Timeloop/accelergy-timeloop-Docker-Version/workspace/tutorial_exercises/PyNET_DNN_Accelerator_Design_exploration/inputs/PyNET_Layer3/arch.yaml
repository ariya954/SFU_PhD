architecture:
  version: 0.4
  nodes:
  - !Container
    name: System
    attributes:
      technology: "40nm"
      global_cycle_seconds: 1e-9

  - !Component
    name: MainMemory
    class: DRAM
    attributes:
      depth: 536870912
      width: 8
      datawidth: 8
      block_size: 1

  - !Component
    name: GlobalBuffer
    class: SRAM
    attributes:
      depth: 1048576
      width: 8
      datawidth: 8
      block_size: 1

  - !Container
    name: PE
    spatial: {meshX: 16, meshY: 16}

  - !Component
    name: RegisterFile
    class: SRAM
    attributes:
      depth: 64
      width: 8
      datawidth: 8
      block_size: 1

  - !Component
    name: MACC
    class: intmac
    attributes:
      width: 16